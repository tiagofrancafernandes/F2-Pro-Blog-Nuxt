<!-- ~/app/spa-loading-template.html -->
<div
    class="spa-loading-screen"
    aria-live="polite"
>
    <div class="loader-container">
        <div
            class="spinner"
            aria-hidden="true"
        ></div>
        <div class="loading-text">Loading App...</div>
    </div>
</div>

<style>
    :root {
        --bg-color: #ffffff;
        --text-color: #1f2937;
        --spinner-track: #e5e7eb;
        --spinner-lead: #e7000b;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --spinner-track: #374151;
            --spinner-lead: #e66369;
        }
    }

    .spa-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--spinner-track);
        border-top-color: var(--spinner-lead);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .loading-text {
        color: var(--text-color);
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.05em;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .spinner {
            animation: linear 2s infinite;
        }
    }
</style>
