<!-- ~/app/spa-loading-template.html -->
<div
    class="spa-loading-screen"
    aria-live="polite"
>
    <div class="loader-container">
        <svg
            class="spinner-svg"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <circle
                class="spinner-track"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="3"
            />
            <path
                class="spinner-lead"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            />
        </svg>
        <div class="loading-text">Carregando...</div>
    </div>
</div>

<style>
    :root {
        --bg-color: #ffffff;
        --text-color: #1f2937;
        --spinner-track-color: #e5e7eb;
        --spinner-lead-color: #10b981;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --spinner-track-color: #334155;
            --spinner-lead-color: #34d399;
        }
    }

    .spa-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    .spinner-svg {
        width: 48px;
        height: 48px;
        animation: spin 0.9s linear infinite;
    }

    .spinner-track {
        color: var(--spinner-track-color);
        opacity: 0.5;
    }

    .spinner-lead {
        color: var(--spinner-lead-color);
    }

    .loading-text {
        color: var(--text-color);
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.03em;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .spinner-svg {
            animation-duration: 2s;
        }
    }
</style>
